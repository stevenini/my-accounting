<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易记账 - 云同步版</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            box-sizing: border-box;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: var(--accent-color);
            color: white;
            padding: 16px;
            border-radius: 6px;
            text-align: center;
        }

        .summary-title {
            font-size: 0.75rem;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .summary-amount {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
        }

        .filter-section label {
            font-size: 0.85rem;
            color: #64748b;
        }

        .input-form {
            display: grid;
            grid-template-columns: 140px 1fr 100px 80px;
            gap: 10px;
            margin-bottom: 20px;
        }

        @media (max-width: 480px) {
            .input-form {
                grid-template-columns: 1fr;
            }
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }

        input, select, button {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .migrate-btn {
            background-color: #10b981;
            margin-bottom: 15px;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f8fafc;
            font-weight: 600;
            font-size: 0.85rem;
            color: #64748b;
        }

        .amount-col {
            text-align: right;
            font-family: monospace;
            font-size: 1rem;
        }

        .action-col {
            text-align: center;
            width: 50px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 0.8rem;
        }

        .empty-tip {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
        }
    </style>

    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <button id="migrateBtn" class="migrate-btn" onclick="migrateLocalData()" style="display:none;">
        发现旧版本地数据，点击一键同步至云端
    </button>

    <!-- 汇总数据区块（含当前、月结、年结） -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-title">当下总支出</div>
            <div class="summary-amount">¥ <span id="totalAmount">0.00</span></div>
        </div>
        <div class="summary-card" style="background-color: #059669;">
            <div class="summary-title"><span id="monthTitle">本月</span>总支出</div>
            <div class="summary-amount">¥ <span id="monthAmount">0.00</span></div>
        </div>
        <div class="summary-card" style="background-color: #d97706;">
            <div class="summary-title"><span id="yearTitle">今年</span>总支出</div>
            <div class="summary-amount">¥ <span id="yearAmount">0.00</span></div>
        </div>
    </div>

    <!-- 月结/年结 统计筛选器 -->
    <div class="filter-section">
        <label>选择统计时间：</label>
        <input type="month" id="monthPicker">
    </div>

    <form class="input-form" id="recordForm">
        <input type="date" id="dateInput" required>
        <input type="text" id="descInput" placeholder="花费说明" required>
        <input type="number" id="amountInput" placeholder="金额" step="0.01" min="0" required>
        <button type="submit">记一笔</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>日期</th>
                <th>说明</th>
                <th style="text-align: right;">金额</th>
                <th style="text-align: center;">操作</th>
            </tr>
        </thead>
        <tbody id="recordList"></tbody>
    </table>
</div>

<script>
    // 已根据截图填入你的 Firebase 真实配置
    const firebaseConfig = {
        apiKey: "AIzaSyBiF_nX1y87y2ItH0EbLBLl9j5BOl0Q0kk",
        authDomain: "my-accounting-6e9fe.firebaseapp.com",
        databaseURL: "https://my-accounting-6e9fe-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "my-accounting-6e9fe",
        storageBucket: "my-accounting-6e9fe.firebasestorage.app",
        messagingSenderId: "157174952439",
        appId: "1:157174952439:web:7d3a445957af857f647ef2"
    };

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const recordsRef = db.ref('accounting_records');

    const recordForm = document.getElementById('recordForm');
    const dateInput = document.getElementById('dateInput');
    const descInput = document.getElementById('descInput');
    const amountInput = document.getElementById('amountInput');
    const recordList = document.getElementById('recordList');
    const monthPicker = document.getElementById('monthPicker');
    const migrateBtn = document.getElementById('migrateBtn');

    let rawData = {}; 

    // 初始化默认日期与筛选时间
    const now = new Date();
    dateInput.value = now.toISOString().split('T')[0];
    monthPicker.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

    // 检查是否有旧版的 localStorage 数据
    const localData = localStorage.getItem('accounting_records');
    if (localData && JSON.parse(localData).length > 0) {
        migrateBtn.style.display = 'block';
    }

    // 监听云端数据库变动
    recordsRef.on('value', (snapshot) => {
        rawData = snapshot.val() || {};
        render();
    });

    monthPicker.addEventListener('change', render);

    function render() {
        recordList.innerHTML = '';
        
        let grandTotal = 0;
        let monthTotal = 0;
        let yearTotal = 0;

        const selectedYearMonth = monthPicker.value; 
        const selectedYear = selectedYearMonth.split('-')[0]; 

        document.getElementById('monthTitle').textContent = selectedYearMonth;
        document.getElementById('yearTitle').textContent = `${selectedYear}年`;

        const recordArray = [];
        for (let key in rawData) {
            recordArray.push({
                id: key,
                ...rawData[key]
            });
        }

        if (recordArray.length === 0) {
            recordList.innerHTML = '<tr><td colspan="4" class="empty-tip">暂无云端记账记录</td></tr>';
        } else {
            recordArray.sort((a, b) => new Date(b.date) - new Date(a.date));

            recordArray.forEach((item) => {
                const amount = parseFloat(item.amount);
                const itemDate = item.date; 
                const itemYearMonth = itemDate.substring(0, 7);
                const itemYear = itemDate.substring(0, 4);

                grandTotal += amount;
                if (itemYearMonth === selectedYearMonth) monthTotal += amount;
                if (itemYear === selectedYear) yearTotal += amount;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${itemDate}</td>
                    <td>${escapeHtml(item.desc)}</td>
                    <td class="amount-col">¥ ${amount.toFixed(2)}</td>
                    <td class="action-col">
                        <button class="delete-btn" onclick="deleteRecord('${item.id}')">删除</button>
                    </td>
                `;
                recordList.appendChild(tr);
            });
        }

        document.getElementById('totalAmount').textContent = grandTotal.toFixed(2);
        document.getElementById('monthAmount').textContent = monthTotal.toFixed(2);
        document.getElementById('yearAmount').textContent = yearTotal.toFixed(2);
    }

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, (m) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
    }

    recordForm.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const newRecord = {
            date: dateInput.value,
            desc: descInput.value.trim(),
            amount: parseFloat(amountInput.value)
        };

        recordsRef.push(newRecord);

        descInput.value = '';
        amountInput.value = '';
        dateInput.value = new Date().toISOString().split('T')[0];
    });

    window.deleteRecord = function(id) {
        recordsRef.child(id).remove();
    };

    window.migrateLocalData = function() {
        if (!confirm("确定要将本机的旧记账数据一次性导入云端吗？")) return;
        
        const localRecords = JSON.parse(localStorage.getItem('accounting_records')) || [];
        localRecords.forEach((record) => {
            recordsRef.push(record);
        });

        localStorage.removeItem('accounting_records');
        migrateBtn.style.display = 'none';
        alert("旧数据已成功导入云端！");
    };
</script>

</body>
</html>
